<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>
Ronald Tetrahedral Name Space
</title>


<style>

body {
	margin:0;
	overflow:hidden;
	background:#000;
}


#panel {

	position:absolute;
	top:20px;
	left:20px;

	color:white;

	font-family:monospace;
	font-size:18px;

	z-index:10;

}


input {

	width:150px;
	font-family:monospace;
	font-size:18px;

}


button {

	font-family:monospace;
	font-size:18px;

}


.info {

	margin-top:10px;

}

</style>



<script type="importmap">

{
	"imports": {

		"three":
		"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",

		"three/addons/":
		"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"

	}
}

</script>


</head>



<body>


<div id="panel">


<div>
<b>Ronald tetrahedral space</b>
</div>


<br>


<div id="hoverInfo" class="info">
Hover: none
</div>


<br>


<div>
Enter Ronald variant:
</div>


<input
id="nameInput"
value="RONALD"
maxlength="6"
>


<button id="generate">
Generate
</button>



<div id="generateInfo" class="info">
Vector: none
</div>


</div>





<script type="module">


import * as THREE from "three";


import {
OrbitControls
}
from
"three/addons/controls/OrbitControls.js";



import {
Line2
}
from
"three/addons/lines/Line2.js";


import {
LineGeometry
}
from
"three/addons/lines/LineGeometry.js";


import {
LineMaterial
}
from
"three/addons/lines/LineMaterial.js";







// ===============================
// TETRAHEDRAL VECTOR SPACE
// ===============================


const vectors = {

R:new THREE.Vector3(1,1,1),

N:new THREE.Vector3(-1,-1,1),

L:new THREE.Vector3(-1,1,-1),

D:new THREE.Vector3(1,-1,-1)

};



const consonants =
[
"R",
"N",
"L",
"D"
];



const colours =
{

R:[1,0.2,0.2],

N:[0.2,1,0.2],

L:[0.2,0.5,1],

D:[1,1,0.2]

};







// ===============================
// THREE INITIALISATION
// ===============================


const scene =
new THREE.Scene();



const camera =
new THREE.PerspectiveCamera(

45,

window.innerWidth /
window.innerHeight,

0.1,

100

);



camera.position.set(
10,
10,
10
);



const renderer =
new THREE.WebGLRenderer(
{
antialias:true
}
);



renderer.setSize(
window.innerWidth,
window.innerHeight
);



document.body.appendChild(
renderer.domElement
);





const controls =
new OrbitControls(
camera,
renderer.domElement
);



controls.enableDamping=true;


controls.target.set(
0,
0,
0
);


controls.update();







// ===============================
// TETRAHEDRON
// ===============================


const tetrahedron =
new THREE.Mesh(

new THREE.TetrahedronGeometry(
2
),

new THREE.MeshBasicMaterial(
{

color:0xffffff,

wireframe:true,

transparent:true,

opacity:0.25

})

);



scene.add(
tetrahedron
);







// ===============================
// VERTEX LABELS
// ===============================


function createLabel(
text,
position
)
{

const canvas =
document.createElement(
"canvas"
);


canvas.width=256;
canvas.height=128;


const ctx =
canvas.getContext(
"2d"
);


ctx.fillStyle="white";


ctx.font="70px monospace";


ctx.fillText(
text,
20,
80
);



const sprite =
new THREE.Sprite(
new THREE.SpriteMaterial(
{
map:
new THREE.CanvasTexture(canvas)
})
);



sprite.position.copy(
position
);



sprite.scale.set(
0.6,
0.3,
1
);



scene.add(
sprite
);

}



for(
const [c,v] of Object.entries(vectors)
)
{

createLabel(
c,
v.clone()
.multiplyScalar(2.5)
);

}








// ===============================
// BUFFERED RONALD MATRIX
// ===============================


const visiblePositions=[];
const visibleColours=[];


const hitPositions=[];


const pathNames=[];







function offsetFor(
code
)
{


const n =
parseInt(

code
.replaceAll("R","0")
.replaceAll("N","1")
.replaceAll("L","2")
.replaceAll("D","3"),

4

);



const spread =
0.02;



return new THREE.Vector3(

Math.sin(n*12.9898)*spread,

Math.cos(n*78.233)*spread,

Math.sin(n*37.719)*spread

);

}








function addVariant(
code
)
{


let current =
new THREE.Vector3();



const offset =
offsetFor(
code
);



for(
const c of code
)
{


const start =
current.clone()
.add(offset);



current =
current.clone()
.add(
vectors[c]
);



const end =
current.clone()
.add(offset);





visiblePositions.push(

start.x,start.y,start.z,

end.x,end.y,end.z

);



const col =
colours[c];


visibleColours.push(

...col,

...col

);





hitPositions.push(

start.x,start.y,start.z,

end.x,end.y,end.z

);


}



pathNames.push(
code
);


}







function generateVariants(
prefix=""
)
{


if(
prefix.length===4
)
{

addVariant(
prefix
);

return;

}



for(
const c of consonants
)
{

generateVariants(
prefix+c
);

}


}



generateVariants();







// ===============================
// VISIBLE MATRIX
// ===============================


const matrixGeometry =
new THREE.BufferGeometry();



matrixGeometry.setAttribute(

"position",

new THREE.Float32BufferAttribute(
visiblePositions,
3
)

);



matrixGeometry.setAttribute(

"color",

new THREE.Float32BufferAttribute(
visibleColours,
3
)

);




const matrixLines =
new THREE.LineSegments(

matrixGeometry,

new THREE.LineBasicMaterial(
{

vertexColors:true,

transparent:true,

opacity:0.35

})

);



scene.add(
matrixLines
);







// ===============================
// HOVER HIT GEOMETRY
// ===============================


const hitGeometry =
new THREE.BufferGeometry();



hitGeometry.setAttribute(

"position",

new THREE.Float32BufferAttribute(
hitPositions,
3
)

);



const hitLines =
new THREE.LineSegments(

hitGeometry,

new THREE.LineBasicMaterial(
{

transparent:true,

opacity:0

})

);



scene.add(
hitLines
);




// ===============================
// PART 2 STARTS HERE
// ===============================
// ===============================
// HOVER + PERSISTENT SELECTION
// ===============================


const raycaster =
new THREE.Raycaster();


const mouse =
new THREE.Vector2();


const hoverInfo =
document.getElementById(
	"hoverInfo"
);



let hoverHighlight = null;

let selectedHighlight = null;






window.addEventListener(
"mousemove",
(event)=>{


mouse.x =
(event.clientX /
window.innerWidth) * 2 - 1;


mouse.y =
-(event.clientY /
window.innerHeight) * 2 + 1;


});









function createLineHighlight(
points,
colour=0xffffff
)
{


const geometry =
new THREE.BufferGeometry()
.setFromPoints(
points
);



return new THREE.LineSegments(

geometry,

new THREE.LineBasicMaterial(
{

color:colour,

transparent:true,

opacity:1

})

);


}








function highlightRonald(
code
)
{


if(
selectedHighlight
)
{

scene.remove(
selectedHighlight
);

}



const index =
pathNames.indexOf(
code
);



if(
index < 0
)
{
return;
}



const positions =
hitLines.geometry.attributes.position.array;



const points=[];



for(
let i=0;
i<4;
i++
)
{


const segment =
(index*4+i)*6;



points.push(

new THREE.Vector3(

positions[segment],

positions[segment+1],

positions[segment+2]

),


new THREE.Vector3(

positions[segment+3],

positions[segment+4],

positions[segment+5]

)

);


}




selectedHighlight =
createLineHighlight(
points
);



scene.add(
selectedHighlight
);



}









function updateHover()
{


raycaster.setFromCamera(
mouse,
camera
);



const intersections =
raycaster.intersectObject(
hitLines
);



if(
intersections.length
)
{


const hit =
intersections[0];



const segmentIndex =
Math.floor(
hit.index / 2
);



const ronaldIndex =
Math.floor(
segmentIndex / 4
);



const code =
pathNames[
ronaldIndex
];




hoverInfo.innerHTML =

"Hover: <b>"
+
code[0]
+
"O"
+
code[1]
+
"A"
+
code[2]
+
code[3]
+
"</b><br>"
+
"Vector: "
+
code;






if(
hoverHighlight
)
{

scene.remove(
hoverHighlight
);

}




const positions =
hitLines.geometry.attributes.position.array;



const i =
segmentIndex*6;



const start =
new THREE.Vector3(
positions[i],
positions[i+1],
positions[i+2]
);



const end =
new THREE.Vector3(
positions[i+3],
positions[i+4],
positions[i+5]
);




hoverHighlight =
createLineHighlight(
[
start,
end
]
);



scene.add(
hoverHighlight
);



}
else
{


hoverInfo.innerHTML =
"Hover: none";



if(
hoverHighlight
)
{

scene.remove(
hoverHighlight
);


hoverHighlight=null;

}


}


}
// ===============================
// GENERATED RONALD VECTOR
// ===============================


const input =
document.getElementById(
	"nameInput"
);


const generateButton =
document.getElementById(
	"generate"
);


const generateInfo =
document.getElementById(
	"generateInfo"
);



let generatedPath = null;


let generatedGeometry = null;


let generatedMaterial = null;







function extractCode(
name
)
{


name =
name.toUpperCase()
.trim();



if(
name.length !== 6
)
{
	return null;
}



if(
name[1] !== "O"
||
name[3] !== "A"
)
{
	return null;
}



const code =

name[0]
+
name[2]
+
name[4]
+
name[5];



for(
const c of code
)
{

	if(
	!vectors[c]
	)
	{
		return null;
	}

}



return code;

}









function createGeneratedPath(
code
)
{


if(
generatedPath
)
{

scene.remove(
generatedPath
);

}




let current =
new THREE.Vector3(
0,
0,
0
);



const points =
[
current.clone()
];






generatedGeometry =
new LineGeometry();



generatedGeometry.setPositions(
[
0,0,0,
0,0,0
]
);






generatedMaterial =
new LineMaterial(
{

color:0xffffff,

linewidth:0.015,

resolution:
new THREE.Vector2(
window.innerWidth,
window.innerHeight
)

});





generatedPath =
new Line2(

generatedGeometry,

generatedMaterial

);



scene.add(
generatedPath
);






let step=0;






function advance()
{


if(
step>=4
)
{

generateInfo.innerHTML =

"Generated: <b>"
+
code[0]
+
"O"
+
code[1]
+
"A"
+
code[2]
+
code[3]
+
"</b>";



return;

}




current =
current.clone()
.add(
vectors[
code[step]
]
);



points.push(
current.clone()
);




const positions=[];



for(
const p of points
)
{

positions.push(
p.x,
p.y,
p.z
);

}



generatedGeometry.setPositions(
positions
);





generateInfo.innerHTML =

"Generating: <b>"
+
code[0]
+
"O"
+
code[1]
+
"A"
+
code[2]
+
code[3]
+
"</b><br>"
+
"Step "
+
(step+1)
+
": "
+
code[step];



step++;



setTimeout(
advance,
600
);



}



advance();



}









generateButton.onclick =
()=>{


const code =
extractCode(
input.value
);



if(
!code
)
{

generateInfo.innerHTML =
"Invalid Ronald variant";


return;

}



createGeneratedPath(
code
);



highlightRonald(
code
);



};








input.addEventListener(
"keydown",
(event)=>{


if(
event.key==="Enter"
)
{

generateButton.click();

}


});








// ===============================
// ANIMATION LOOP
// ===============================


function animate()
{


requestAnimationFrame(
animate
);



updateHover();



controls.update();



renderer.render(
scene,
camera
);



}



animate();








// ===============================
// RESIZE
// ===============================


window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth /
window.innerHeight;



camera.updateProjectionMatrix();



renderer.setSize(
window.innerWidth,
window.innerHeight
);



if(
generatedMaterial
)
{

generatedMaterial.resolution.set(
window.innerWidth,
window.innerHeight
);

}


});



</script>


</body>


</html>
