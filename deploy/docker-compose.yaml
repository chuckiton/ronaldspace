services:
  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    init: true
    ports:
      - "${HTTP_PORT:-8888}:8080"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 64m
    cpus: 0.50
